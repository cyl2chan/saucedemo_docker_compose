# Homework 16.: 
# Create a .github/workflows/docker-tests.yml that 
# runs docker compose up --build --abort-on-container-exit in CI. 
# Upload reports/ as an artifact. --

name: Build and Test Swaglabs with docker compose
on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on:ubuntu-latest

  steps: 
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run docker compose
      run: docker compose up --build -- abort-on-container-exit 

    - name: Uplaod artifact
      if: always()
      uses: actions/upload-artifact@v4
      with: 
        name: test-report
        path: reports/